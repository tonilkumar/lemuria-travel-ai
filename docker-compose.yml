services:
  postgres:
    image: postgres:17-alpine
    container_name: lemuria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lemuria
      POSTGRES_PASSWORD: lemuria
      POSTGRES_DB: lemuria_dev
    ports:
      - "5432:5432"
    volumes:
      - lemuria-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemuria -d lemuria_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lemuria-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - lemuria-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lemuria-pgdata:
  lemuria-redisdata:
